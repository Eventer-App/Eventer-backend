spring:
  application:
    name: Eventer

---
spring:
  config:
    activate:
      on-profile: LOCAL

  datasource:
    url: jdbc:postgresql://localhost:5432/EVENTER
    username: eventer
    password: eventer
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

